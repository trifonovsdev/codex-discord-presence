name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check JavaScript
        run: npm run check
      - name: Check Python
        run: python -m py_compile src/remote-monitor.py
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $errors = @()
          git ls-files '*.ps1' | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $_), [ref]$tokens, [ref]$fileErrors)
            $errors += $fileErrors
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Build tray application
        run: dotnet build tray/CodexPresence.Tray.csproj -c Release
      - name: Verify C# formatting
        run: dotnet format tray/CodexPresence.Tray.csproj --verify-no-changes --no-restore

  installer-smoke:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup --version 6.7.3 --source winget --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: Build release candidate
        shell: pwsh
        run: .\build-release.ps1
      - name: Smoke-test installer lifecycle
        shell: pwsh
        run: .\tests\installer-smoke.ps1
