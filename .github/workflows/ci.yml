name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check JavaScript
        run: npm run check
      - name: Check Python
        run: python -m py_compile src/remote-monitor.py
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $errors = @()
          git ls-files '*.ps1' | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $_), [ref]$tokens, [ref]$fileErrors)
            $errors += $fileErrors
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build tray application
        run: dotnet build tray/CodexPresence.Tray.csproj -c Release
      - name: Verify C# formatting
        run: dotnet format tray/CodexPresence.Tray.csproj --verify-no-changes --no-restore
