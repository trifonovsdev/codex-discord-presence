name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript
        run: npm run check
      - name: Check Python
        run: python -m py_compile src/remote-monitor.py
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$fileErrors)
            $errors += $fileErrors
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }
