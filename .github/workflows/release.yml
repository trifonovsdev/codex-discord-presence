name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  windows-release:
    needs: validate
    runs-on: windows-latest
    env:
      SIGNING_AVAILABLE: ${{ secrets.CODE_SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath .\package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Invalid package version: $version" }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne $tag) {
            throw "Release must run from tag $tag; received $($env:GITHUB_REF_TYPE) $($env:GITHUB_REF_NAME)."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Refuse to overwrite an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists; refusing to overwrite its assets." }
          $global:LASTEXITCODE = 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup --version 6.7.3 --source winget --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: Import optional code-signing certificate
        if: env.SIGNING_AVAILABLE == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codex-presence-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          "CODE_SIGN_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
      - name: Build release
        shell: pwsh
        run: .\build-release.ps1 -Version $env:RELEASE_VERSION
      - name: Smoke-test installer lifecycle
        shell: pwsh
        run: .\tests\installer-smoke.ps1
      - name: Verify Authenticode when signing is configured
        if: env.SIGNING_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature .\artifacts\CodexPresenceSetup.exe
          if ($signature.Status -ne 'Valid') { throw "Invalid installer signature: $($signature.Status)" }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG .\artifacts\CodexPresenceSetup.exe .\artifacts\CodexPresence-*-portable.zip .\artifacts\SHA256SUMS.txt --generate-notes --latest --title "Codex Presence $env:RELEASE_TAG"
      - name: Remove signing certificate
        if: ${{ always() && env.CODE_SIGN_THUMBPRINT != '' }}
        shell: pwsh
        run: Remove-Item "Cert:\CurrentUser\My\$env:CODE_SIGN_THUMBPRINT" -Force
